services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flocksense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - flocksense-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: host=postgres user=postgres password=postgres dbname=flocksense port=5432 sslmode=disable
      JWT_SECRET: change-me-in-development
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  flocksense-postgres:
